<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu folleto — {{ proyecto }}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#111418;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .box{max-width:420px;width:100%}
    .check{width:78px;height:78px;border-radius:50%;background:#29b6e8;color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-weight:700}
    h1{font-size:25px;margin-bottom:12px}
    p{opacity:.85;font-size:16px;margin-bottom:24px}
    .btn{display:flex;align-items:center;justify-content:center;gap:9px;background:#29b6e8;color:#fff;text-decoration:none;padding:16px 22px;border-radius:10px;font-weight:700;font-size:16px;width:100%}
    .btn.wa{background:#25D366;margin-top:12px}
    .btn svg{width:22px;height:22px;fill:#fff}
    .chico{font-size:13px;opacity:.6;margin-top:18px}
  </style>
</head>
<body>
  <div class="box">
    <div class="check">✓</div>
    <h1>¡Listo! Acá tenés el folleto</h1>
    <p>Folleto de <b>{{ proyecto }}</b> con planos, terminaciones y precios.</p>
    <a class="btn" href="{{ url_for('folleto_pdf', slug=slug) }}" target="_blank">⬇ Abrir el folleto (PDF)</a>
    {% if wa_link %}
    <a class="btn wa" href="{{ wa_link }}"><svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.08c-.24.68-1.42 1.3-1.96 1.38-.5.08-1.13.11-1.83-.11-.42-.13-.96-.31-1.65-.61-2.91-1.26-4.81-4.19-4.95-4.38-.15-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.66.5.24.58.83 2.01.9 2.16.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.45.29.15.46.12.63-.07.17-.19.73-.85.92-1.14.19-.29.39-.24.66-.15.27.1 1.7.8 1.99.95.29.15.49.22.56.34.07.12.07.7-.17 1.38z"/></svg>Consultar por WhatsApp</a>
    {% endif %}
    <p class="chico">Si el folleto no se abrió solo, tocá el botón celeste.</p>
  </div>
  <script>
    // Abre el folleto automáticamente al llegar
    setTimeout(function(){ window.location.href = "{{ url_for('folleto_pdf', slug=slug) }}"; }, 900);
  </script>
</body>
</html>

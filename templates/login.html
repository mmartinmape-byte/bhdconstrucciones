<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — {{ empresa }}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#111418;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
    h1{font-size:20px;color:#111418;margin-bottom:6px}
    p{color:#8a94a0;font-size:13px;margin-bottom:20px}
    input{width:100%;padding:13px 14px;border:1.5px solid #e6eaee;border-radius:10px;font-size:15px}
    input:focus{outline:none;border-color:#29b6e8}
    .btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:#29b6e8;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    .flash{background:#f8d7da;color:#721c24;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Panel de {{ empresa }}</h1>
    <p>Ingresá la contraseña para ver los leads.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <input type="password" name="password" placeholder="Contraseña" required autofocus>
    <button class="btn" type="submit">Entrar</button>
  </form>
</body>
</html>

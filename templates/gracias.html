<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Gracias! — {{ empresa }}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#111418;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .box{max-width:420px}
    .check{width:78px;height:78px;border-radius:50%;background:#29b6e8;color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-weight:700}
    h1{font-size:25px;margin-bottom:12px}
    p{opacity:.85;font-size:16px;margin-bottom:26px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#25D366;color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px}
    .btn svg{width:22px;height:22px;fill:#fff}
    .btn.sec{background:transparent;border:1.5px solid rgba(255,255,255,.35);margin-top:12px}
  </style>
</head>
<body>
  <div class="box">
    <div class="check">✓</div>
    <h1>¡Gracias por contactarnos!</h1>
    <p>Recibimos tus datos. Un asesor de {{ empresa }} se va a comunicar con vos muy pronto.</p>
    {% if whatsapp %}
      <a class="btn" href="https://wa.me/{{ whatsapp }}" target="_blank"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.359.101 11.892c0 2.096.549 4.142 1.595 5.945L0 24l6.335-1.652a11.882 11.882 0 005.71 1.454h.006c6.585 0 11.946-5.359 11.949-11.895a11.821 11.821 0 00-3.48-8.458"/></svg>Escribinos por WhatsApp</a><br>
    {% endif %}
    <a class="btn sec" href="/">Volver al inicio</a>
  </div>
</body>
</html>
